name: FinPilot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/finpilot-v1.2-runtime]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Core regression tests
        run: python -m unittest discover -s finpilot/tests -p 'test*.py' -v
      - name: Service tests
        working-directory: backend
        run: python -m unittest tests.test_services -v
      - name: FastAPI HTTP integration tests
        working-directory: backend
        run: python -m pytest tests/test_api.py -v
      - name: Core evaluation
        run: python -m finpilot.run_evaluation

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build Next.js frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          INTERNAL_API_URL: http://backend:8000/api/v1
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare demo environment
        run: cp .env.example .env
      - name: Validate compose configuration
        run: docker compose config
      - name: Build demo images
        run: docker compose build
      - name: Start FinPilot stack
        run: docker compose up -d
      - name: Smoke-test running backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          backend_ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/api/v1/health > /tmp/finpilot-health.json; then backend_ok=1; break; fi
            sleep 2
          done
          test "$backend_ok" -eq 1
          cat /tmp/finpilot-health.json
          curl -fsS http://localhost:8000/api/v1/overview > /tmp/finpilot-overview.json

          frontend_ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/ > /tmp/finpilot-home.html; then frontend_ok=1; break; fi
            sleep 2
          done
          test "$frontend_ok" -eq 1
          grep -qi "FinPilot" /tmp/finpilot-home.html

          curl -fsS \
            -H 'Content-Type: application/json' \
            -H 'X-Demo-Role: VIEWER' \
            -d '{"question":"Why is our cash position expected to weaken next week?"}' \
            http://localhost:8000/api/v1/controller/query > /tmp/finpilot-q1.json
          grep -q 'cash_weakening' /tmp/finpilot-q1.json

          curl -fsS \
            -H 'Content-Type: application/json' \
            -H 'X-Demo-Role: ANALYST' \
            -d '{"question":"Can you resolve the most important issue?"}' \
            http://localhost:8000/api/v1/controller/query > /tmp/finpilot-q3.json
          grep -q 'resolve_top_priority' /tmp/finpilot-q3.json
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop FinPilot stack
        if: always()
        run: docker compose down -v
